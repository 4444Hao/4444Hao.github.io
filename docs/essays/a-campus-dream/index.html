  <main id="main" class="wrap reading-main"><div class="reading-layout"><article class="essay"><header class="article-heading"><a class="back-link" href="/notes/#records">返回短记</a><div class="article-meta"><a href="/notes/">短记</a><div class="note-time"><span>写于 <time datetime="2026-08-15">2026-08-15</time></span><span>更新于 <time datetime="2026-10-03">2026-10-03</time></span></div></div><h1>梦话</h1><div class="entry-tags"><a href="/all/?tag=%E6%97%A5%E5%B8%B8#records">日常</a><a href="/all/?tag=%E5%9B%9E%E5%BF%86#records">回忆</a></div><p class="source-note"><strong>个人记录</strong> · 个人记录。</p></header><div class="prose"><p>梦见一个以大学校园为场景，以本专业的同学为主要人物的梦。在一个很辽阔的草坪上，类似于操场。远远地看去，天上有一朵云一样的，但又像气球。很大一片，浮在空中，远远地望去。当走到下面时，有一根绳子，拉住绳子似乎也就飘起来了。吸引了同学的注意。然后一起准备把这个漂浮的巨物给收集起来。</p></div><p class="maintenance-date">内容整理更新：2026-10-03</p><nav class="essay-neighbors" aria-label="相邻记录"><a href="/essays/a-cat-during-finals/"><span>上一篇</span>小猫期末周</a><a href="/essays/small-routines-for-energy/"><span>下一篇</span>对抗困乏</a></nav></article></div></main>
