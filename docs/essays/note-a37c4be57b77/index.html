  <main id="main" class="wrap reading-main"><div class="reading-layout"><article class="essay"><header class="article-heading"><a class="back-link" href="/excerpts/#records">返回摘录</a><div class="article-meta"><a href="/excerpts/">摘录</a><div class="note-time"><span>更新于 <time datetime="2026-10-03">2026-10-03</time></span></div></div><h1>你永远不可能真正了解一个人</h1><div class="entry-tags"><a href="/all/?tag=%E5%85%B3%E7%B3%BB#records">关系</a><a href="/all/?tag=%E6%83%85%E7%BB%AA#records">情绪</a></div><p class="source-note"><strong>摘录</strong> · 来源待核；保留原笔记文字，不据此确认作者或观点。</p></header><div class="prose"><p>你永远不可能真正了解一个人<br>
除非你穿上他的鞋子走来走去<br>
可真当你走过他的路时<br>
你连路过都觉得难过<br>
有时候你所看到的并非事情真相<br>
你了解的不过是<br>
浮在上面的冰山一角<br>
正如那句话<br>
你对我的百般注解和识读<br>
并不构成万分之一的我<br>
却是一览无遗的你</p></div><p class="maintenance-date">内容整理更新：2026-10-03</p><nav class="essay-neighbors" aria-label="相邻记录"><a href="/essays/note-603640ad834c/"><span>上一篇</span>命定之路</a><a href="/essays/note-e0dacb84ba27/"><span>下一篇</span>年少不可得之物</a></nav></article></div></main>
