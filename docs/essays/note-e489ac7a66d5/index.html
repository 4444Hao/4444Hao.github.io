  <main id="main" class="wrap reading-main"><div class="reading-layout"><article class="essay"><header class="article-heading"><a class="back-link" href="/excerpts/#records">返回摘录</a><div class="article-meta"><a href="/excerpts/">摘录</a><div class="note-time"><span>更新于 <time datetime="2026-10-03">2026-10-03</time></span></div></div><h1>物质永不满足</h1><div class="entry-tags"><a href="/all/?tag=%E9%80%89%E6%8B%A9#records">选择</a><a href="/all/?tag=%E6%84%8F%E4%B9%89#records">意义</a></div><p class="source-note"><strong>摘录</strong> · 来源待核；保留原笔记文字，不据此确认作者或观点。</p></header><div class="prose"><p>我们处于一个物质永不满足的时代，我们喜欢得到，害怕失去。为利，折损生命；为名对别人甚至卑躬屈膝。但是对什么过于偏爱，就必定被什么过分的消耗。<br>
不断抛弃不必要的东西，内心才不至于被蒙蔽，光才能照进来，才能看清楚自己内心真正的需求，常人多为物欲牵蔽，不能循得良知。</p></div><p class="maintenance-date">内容整理更新：2026-10-03</p><nav class="essay-neighbors" aria-label="相邻记录"><a href="/essays/note-ed58269fcf16/"><span>上一篇</span>未完成情结</a><a href="/essays/note-600204b17cda/"><span>下一篇</span>虚无主义</a></nav></article></div></main>
