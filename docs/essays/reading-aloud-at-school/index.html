  <main id="main" class="wrap reading-main"><div class="reading-layout"><article class="essay"><header class="article-heading"><a class="back-link" href="/essays/#records">返回随笔</a><div class="article-meta"><a href="/essays/">随笔</a><div class="note-time"><span>更新于 <time datetime="2026-10-03">2026-10-03</time></span></div></div><h1>小学读书的挫败</h1><div class="entry-tags"><a href="/all/?tag=%E5%9B%9E%E5%BF%86#records">回忆</a><a href="/all/?tag=%E5%AD%A6%E4%B9%A0#records">学习</a><a href="/all/?tag=%E6%83%85%E7%BB%AA#records">情绪</a></div><p class="source-note"><strong>个人记录</strong> · 个人记录。</p></header><div class="prose"><p>小学上语文课，老师常让学生轮流读课文。我常常被点到，可我读得磕磕绊绊，倒不是因为生字，而是读着会跳字。老师不断纠正，我只得重新读。其他同学总是读得那么流畅，我显得力不从心。课下我也总是预习课文，仔细地一个字一个字地读着，可是连成句子又跳过了几个字。小时候总在读书上感到挫败。</p></div><p class="maintenance-date">内容整理更新：2026-10-03</p><nav class="essay-neighbors" aria-label="相邻记录"><a href="/essays/one-small-step/"><span>上一篇</span>随记碎语</a><a href="/essays/reading-animal-farm/"><span>下一篇</span>读动物农场</a></nav></article></div></main>
