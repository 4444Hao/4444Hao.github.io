  <main id="main" class="wrap reading-main"><div class="reading-layout"><article class="essay"><header class="article-heading"><a class="back-link" href="/essays/#records">返回随笔</a><div class="article-meta"><a href="/essays/">随笔</a><div class="note-time"><span>更新于 <time datetime="2026-10-03">2026-10-03</time></span></div></div><h1>走路</h1><div class="entry-tags"><a href="/all/?tag=%E8%87%AA%E7%84%B6#records">自然</a><a href="/all/?tag=%E7%8B%AC%E5%A4%84#records">独处</a><a href="/all/?tag=%E6%83%85%E7%BB%AA#records">情绪</a></div><p class="source-note"><strong>个人记录</strong> · 个人记录。</p></header><div class="prose"><p>我喜欢走路。心理失意时、迷茫时、无所事事时，我会一直走着，没有目的、没有方向，只是在路上。</p>
<p>我走着，好像没有任何顾虑了。</p>
<p>我讨厌走路我走着走着，越发觉得这个世界如此真实而又遥远。吹动的树叶、路上的花草，我好像感受到了时空。</p></div><p class="maintenance-date">内容整理更新：2026-10-03</p><nav class="essay-neighbors" aria-label="相邻记录"><a href="/essays/quiet-in-solitude/"><span>上一篇</span>独处的平静</a><a href="/essays/running-and-awareness/"><span>下一篇</span>跑步与意识</a></nav></article></div></main>
