<svg id="my-svg" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="flowchart" style="max-width: 360px; background-color: transparent;" viewBox="4 4 360 814" role="graphics-document document" aria-roledescription="flowchart-v2"><style>#my-svg{font-family:Microsoft YaHei,PingFang SC,sans-serif;font-size:16px;fill:#263d2e;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#my-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#my-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#my-svg .error-icon{fill:#eef3e9;}#my-svg .error-text{fill:#110c16;stroke:#110c16;}#my-svg .edge-thickness-normal{stroke-width:1px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#64846b;stroke:#64846b;}#my-svg .marker.cross{stroke:#64846b;}#my-svg svg{font-family:Microsoft YaHei,PingFang SC,sans-serif;font-size:16px;}#my-svg p{margin:0;}#my-svg .label{font-family:Microsoft YaHei,PingFang SC,sans-serif;color:#263d2e;}#my-svg .cluster-label text{fill:#110c16;}#my-svg .cluster-label span{color:#110c16;}#my-svg .cluster-label span p{background-color:transparent;}#my-svg .label text,#my-svg span{fill:#263d2e;color:#263d2e;}#my-svg .node rect,#my-svg .node circle,#my-svg .node ellipse,#my-svg .node polygon,#my-svg .node path{fill:#e8f0e5;stroke:#91aa89;stroke-width:1px;}#my-svg .rough-node .label text,#my-svg .node .label text,#my-svg .image-shape .label,#my-svg .icon-shape .label{text-anchor:middle;}#my-svg .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#my-svg .rough-node .label,#my-svg .node .label